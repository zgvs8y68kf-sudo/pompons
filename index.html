<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Les Pompons</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pompons">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFD93D">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<link rel="icon" type="image/png" href="icon.png">
<style>
/* ── Tokens ──────────────────────────────────────────── */
:root{
  --sun:#FFD93D;--paper:#FFFFFF;--ink:#141414;--ink-2:#3A3A3A;--ink-3:#6B6B6B;--soft:#FFF4C2;
  --c0:#FF5D8F;--c1:#3FA9FF;--c2:#FF9F1C;--c3:#8E6CFF;
  --ok:#2FBF71;--danger:#E5383B;
  --bd:3px solid var(--ink);--sh:4px 4px 0 var(--ink);--tab-h:62px;
  --title:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --font:"Nunito",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  color-scheme:light;
}

/* ── Base ────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--sun);min-height:100%}
body{font-family:var(--font);color:var(--ink);font-size:16px;line-height:1.35;font-weight:700;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--c3);outline-offset:3px}
svg{display:block;flex:none}
.num{font-variant-numeric:tabular-nums}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid var(--ink);flex:none}

/* ── Shell ───────────────────────────────────────────── */
.top{position:sticky;top:0;z-index:10;background:var(--sun);
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left))}
.top-in{max-width:620px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.top h1{font-family:var(--title);font-weight:400;font-size:32px;letter-spacing:.5px;text-transform:uppercase;line-height:1}
.offline{font-size:13px;font-weight:800;background:var(--paper);border:var(--bd);border-radius:999px;padding:3px 10px}
main{padding:6px max(16px,env(safe-area-inset-right)) calc(var(--tab-h) + env(safe-area-inset-bottom) + 28px) max(16px,env(safe-area-inset-left))}
.page{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:24px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);border-top:var(--bd);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{max-width:620px;margin:0 auto;display:flex;height:var(--tab-h)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:800;color:var(--ink-3)}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--c0)}

/* ── Buttons ─────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 14px;
  border:var(--bd);border-radius:14px;background:var(--paper);box-shadow:var(--sh);font-weight:900;font-size:16px;line-height:1.05;
  transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.4;box-shadow:none}
.btn-primary{background:var(--ink);color:var(--sun);font-family:var(--title);font-weight:400;font-size:20px;letter-spacing:.5px;text-transform:uppercase}
.btn-soft{background:var(--paper)}
.btn-danger{background:var(--paper);color:var(--danger);box-shadow:none;border-color:transparent}
.btn-link{border:0;box-shadow:none;background:none;min-height:36px;text-decoration:underline;text-underline-offset:3px;font-size:14px}

/* ── Kid boards (all kids on one screen) ─────────────── */
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.board.one{grid-template-columns:1fr}
.kc{background:var(--paper);border:var(--bd);border-radius:20px;box-shadow:5px 5px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column}
.kc-h{background:var(--c);border-bottom:var(--bd);padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.kc-h b{font-family:var(--title);font-weight:400;font-size:22px;letter-spacing:.3px;color:#fff;
  text-shadow:2px 2px 0 var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.kc-b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px;flex:1}
.kc-time{font-family:var(--title);font-size:34px;line-height:1;letter-spacing:.3px}
.kc-time small{font-size:18px}
.kc-sub{font-size:13px;color:var(--ink-3);margin-top:3px}
.stk{display:flex;flex-wrap:wrap;gap:4px;min-height:20px}
.st{width:20px;height:20px;border-radius:50%;background:var(--c);border:2.5px solid var(--ink);position:relative}
.st::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;top:3px;left:3px;opacity:.9}
.st.pop{animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
.more{font-size:13px;font-weight:900;align-self:center;margin-left:2px}
.pts{display:flex;gap:3px;align-items:center}
.pt{width:11px;height:11px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--ink) 45%,transparent)}
.pt.on{background:var(--c);border:2px solid var(--ink)}
.pts span{font-size:12px;color:var(--ink-3);margin-left:4px;white-space:nowrap}
.kc-btns{display:grid;grid-template-columns:1fr;gap:9px;margin-top:auto}
.kc-btns .btn{min-height:48px;justify-content:space-between;padding:0 12px;font-size:17px;white-space:nowrap}
.kc-btns .btn small{font-size:12px;font-weight:800;opacity:.75}
.kc-btns .btn-primary{justify-content:center}
.kc-btns .add-s{background:color-mix(in srgb,var(--c) 22%,#fff)}
.kc-btns .add-b{background:var(--c);color:#fff;text-shadow:1px 1px 0 rgb(0 0 0 / .35)}
.kc-btns .btn-primary{grid-column:1/-1;font-size:18px;min-height:50px}
.kc-btns .btn-link{grid-column:1/-1;margin-top:-4px}
.hint{grid-column:1/-1;font-size:12px;text-align:center;color:var(--ink-3);margin-top:-4px}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.25)}100%{transform:scale(1)}}

/* ── Sections / lists ────────────────────────────────── */
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 10px}
.sec-h h2{font-family:var(--title);font-weight:400;font-size:26px;letter-spacing:.4px;text-transform:uppercase;line-height:1}
.sec-h .meta{font-size:14px;color:var(--ink-2)}
.seg{display:inline-flex;background:var(--paper);border:var(--bd);border-radius:12px;padding:2px;box-shadow:3px 3px 0 var(--ink)}
.seg button{padding:5px 11px;border-radius:8px;font-size:14px;font-weight:900}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sun)}
.card,.list{background:var(--paper);border:var(--bd);border-radius:20px;box-shadow:5px 5px 0 var(--ink);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:58px;position:relative}
.row + .row{border-top:2px solid color-mix(in srgb,var(--ink) 12%,transparent)}
.row-main{flex:1;min-width:0}
.row-t{font-size:16px;font-weight:800;line-height:1.25}
.row-s{font-size:13px;font-weight:700;color:var(--ink-3);margin-top:2px}
button.row{width:100%;text-align:left}
.chev{color:var(--ink)}
.empty{padding:22px 16px;color:var(--ink-2);font-size:15px;text-align:center}

/* Routines: one column per kid */
.rt{display:grid;align-items:stretch}
.rt > *{padding:10px 0;border-top:2px solid color-mix(in srgb,var(--ink) 12%,transparent)}
.rt .hd.lb{justify-content:flex-end}
.rt .hd{border-top:0;padding:10px 0 6px;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.3px;color:var(--ink-3)}
.rt .kh{display:flex;flex-direction:column;justify-content:flex-end;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-size:13px}
.rt .kh i{display:block;width:20px;height:6px;border-radius:3px;background:var(--c);margin:0 auto 4px;border:1.5px solid var(--ink)}
.rt .lb{padding-left:14px;padding-right:8px;min-width:0;display:flex;flex-direction:column;justify-content:center}
.rt .cl{display:flex;justify-content:center;align-items:center;padding-right:2px}
.rt .cl:last-child{padding-right:10px}
.ck{width:40px;height:40px;border:var(--bd);border-radius:12px;background:#fff;display:grid;place-items:center;color:transparent;flex:none;
  transition:transform .06s}
.ck:active:not(:disabled){transform:scale(.9)}
.ck.on{background:var(--c);color:#fff}
.ck:disabled{opacity:.4}
.cnt{display:flex;flex-direction:column;align-items:center;gap:2px}
.ck.rep{font-family:var(--title);font-size:20px;color:var(--ink)}
.ck.rep.on{color:#fff;text-shadow:1px 1px 0 rgb(0 0 0 / .35)}
.minus{font-size:12px;font-weight:900;color:var(--ink-3);padding:1px 6px;border-radius:6px}
.done-n{text-align:center;margin-top:10px;font-size:14px;color:var(--ink-2)}

/* History */
.amt{font-family:var(--title);font-size:18px;white-space:nowrap;letter-spacing:.3px}
.amt.plus{color:#138A4A}
.amt.minus{color:var(--ink)}
.day-h{font-family:var(--title);font-weight:400;font-size:18px;text-transform:uppercase;letter-spacing:.4px;margin:0 2px 8px}
.week{display:grid;grid-template-columns:minmax(0,1fr) auto auto;column-gap:18px;padding:0 14px}
.week > div{padding:12px 0;border-top:2px solid color-mix(in srgb,var(--ink) 12%,transparent)}
.week > div:nth-child(-n+3){border-top:0}
.week .h{font-size:12px;font-weight:900;color:var(--ink-3);text-transform:uppercase;padding-bottom:4px}
.week .k{display:flex;align-items:center;gap:8px;min-width:0}
.week .v{text-align:right}

/* ── Sheet ───────────────────────────────────────────── */
dialog.sheet{margin:auto auto 0;width:100%;max-width:620px;max-height:92dvh;border:var(--bd);border-bottom:0;padding:0;
  background:var(--paper);color:var(--ink);border-radius:24px 24px 0 0;overflow:auto}
dialog.sheet::backdrop{background:rgb(20 20 20 / .45)}
dialog.sheet[open]{animation:up .25s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
.sheet-in{padding:10px 18px calc(20px + env(safe-area-inset-bottom))}
.grab{width:40px;height:6px;border-radius:3px;background:var(--ink);opacity:.2;margin:0 auto 12px}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.sheet-h h3{font-family:var(--title);font-weight:400;font-size:24px;text-transform:uppercase;letter-spacing:.4px;line-height:1.1}
.sheet-h p{font-size:14px;color:var(--ink-3);margin-top:3px}
.x{width:36px;height:36px;border-radius:50%;border:var(--bd);display:grid;place-items:center;flex:none}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{min-height:66px;border:var(--bd);border-radius:14px;box-shadow:var(--sh);background:#fff;font-family:var(--title);font-size:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;letter-spacing:.3px}
.opt small{font-family:var(--font);font-size:12px;font-weight:800;color:var(--ink-3)}
.opt.main{background:var(--ink);color:var(--sun)}
.opt.main small{color:var(--sun);opacity:.75}
.opt:disabled{opacity:.3;box-shadow:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label,.lab{font-size:14px;font-weight:900}
.input{width:100%;min-height:50px;border:var(--bd);border-radius:12px;background:#fff;padding:0 14px;font-size:17px;font-weight:800}
.input:focus{outline:none;box-shadow:var(--sh)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:2px solid color-mix(in srgb,var(--ink) 12%,transparent)}
.frow .lab small{display:block;font-weight:700;color:var(--ink-3);font-size:13px}
.step{display:flex;align-items:center;gap:4px;flex:none}
.step .n{min-width:30px;text-align:center;font-family:var(--title);font-size:22px}
.step button{width:40px;height:40px;border:var(--bd);border-radius:12px;display:grid;place-items:center;background:#fff;box-shadow:2px 2px 0 var(--ink)}
.step button:disabled{opacity:.3;box-shadow:none}
.switch{appearance:none;-webkit-appearance:none;width:54px;height:32px;border-radius:16px;border:var(--bd);background:#fff;position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .15s}
.switch:checked{background:var(--ok)}
.switch:checked::after{transform:translateX(22px);background:#fff;box-shadow:0 0 0 2px var(--ink)}
.colors{display:flex;gap:12px}
.sw{width:42px;height:42px;border-radius:50%;background:var(--c);border:var(--bd);display:grid;place-items:center;color:#fff}
.sw[aria-pressed="true"]{box-shadow:var(--sh)}
.sheet-foot{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.sheet-foot .btn{width:100%}
.summary{font-size:14px;color:var(--ink-2);text-align:center;margin-top:12px}

/* ── Toast ───────────────────────────────────────────── */
.toast{position:fixed;left:50%;transform:translateX(-50%);z-index:40;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 12px);
  width:min(calc(100% - 32px),588px);background:var(--ink);color:#fff;border-radius:16px;padding:10px 8px 10px 16px;
  display:flex;align-items:center;gap:12px;font-size:15px;font-weight:800;box-shadow:4px 4px 0 rgb(0 0 0 / .25)}
.toast span{flex:1;min-width:0}
.toast button{font-weight:900;padding:8px 12px;border-radius:10px;background:var(--sun);color:var(--ink)}

/* ── Login ───────────────────────────────────────────── */
.login{position:fixed;inset:0;z-index:50;background:var(--sun);display:flex;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));overflow:auto}
.login-in{width:100%;max-width:330px;display:flex;flex-direction:column;align-items:center;text-align:center}
.mark{display:flex;align-items:flex-end;gap:4px;margin-bottom:14px}
.mark i{border-radius:50%;background:var(--c0);border:3px solid var(--ink);width:34px;height:34px}
.mark i:nth-child(2){background:var(--c1);width:24px;height:24px}
.mark i:nth-child(3){background:var(--c2);width:16px;height:16px}
.login h2{font-family:var(--title);font-weight:400;font-size:40px;text-transform:uppercase;letter-spacing:.5px;line-height:1}
.login .fam{font-size:16px;margin-top:6px}
.login .ask{margin-top:28px;font-size:16px;font-weight:900}
.pins{display:flex;gap:14px;margin:14px 0 4px}
.pins i{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.pins i.on{background:var(--c0)}
.pins.bad{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pin-err{font-size:14px;color:var(--danger);min-height:20px;font-weight:900}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:14px;margin-top:10px}
.pad button{height:70px;border:var(--bd);border-radius:18px;background:#fff;box-shadow:var(--sh);font-family:var(--title);font-size:30px}
.pad button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.pad .ghost{font-family:var(--font);font-size:14px;font-weight:900}
.who{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:14px}
.who .btn{width:100%;min-height:60px;font-family:var(--title);font-weight:400;font-size:24px;text-transform:uppercase;letter-spacing:.5px}
.who .btn:first-child{background:var(--c1);color:#fff;text-shadow:2px 2px 0 var(--ink)}
.who .btn:last-child{background:var(--c0);color:#fff;text-shadow:2px 2px 0 var(--ink)}

@media (max-width:360px){.kc-time{font-size:28px}.kc-btns .btn{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- Connexion -->
<div class="login" id="login" hidden>
  <div class="login-in">
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
    <h2>Les Pompons</h2>
    <p class="fam">Famille Palcoux-Testud</p>
    <div id="pinStep">
      <p class="ask">Code famille</p>
      <div class="pins" id="pins" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <p class="pin-err" id="pinErr" role="alert"></p>
      <div class="pad" id="pad" role="group" aria-label="Clavier du code">
        <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
        <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
        <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
        <span></span><button type="button" data-k="0">0</button><button type="button" class="ghost" data-k="del" aria-label="Effacer">Effacer</button>
      </div>
    </div>
    <div id="whoStep" hidden style="width:100%">
      <p class="ask">Qui utilise l'appli ?</p>
      <div class="who" id="who"></div>
    </div>
  </div>
</div>

<header class="top">
  <div class="top-in">
    <h1 id="title">Les Pompons</h1>
    <span class="offline" id="offline" hidden>Hors ligne</span>
  </div>
</header>

<main>
  <div class="page" id="view"></div>
</main>

<nav class="tabbar" aria-label="Navigation">
  <div class="tabbar-in" id="tabbar">
    <button class="tab" type="button" data-tab="home" aria-current="page">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="14" r="5"/><circle cx="17.5" cy="7.5" r="3"/></svg>
      Pompons
    </button>
    <button class="tab" type="button" data-tab="history">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      Historique
    </button>
    <button class="tab" type="button" data-tab="settings">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      Réglages
    </button>
  </div>
</nav>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle"><div class="sheet-in" id="sheetBody"></div></dialog>

<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button type="button" id="toastUndo">Annuler</button></div>

<script>
/* ---------- Règles ---------- */
const UNIT = 30;            // 1 petit pompon = 30 s
const PER_BIG = 10;         // 10 petits = 1 gros
const BIG = UNIT * PER_BIG; // 1 gros pompon = 5 min
const USE_DEFAULT = 30;     // minutes
const USE_OPTIONS = [5, 10, 15, 30, 45, 60];
const PIN = "1234";
const USERS = ["Papa", "Maman"];
const BASE = "https://pompons-palcoux-testud-default-rtdb.europe-west1.firebasedatabase.app/families/palcoux-testud";
const COLORS = ["--c0", "--c1", "--c2", "--c3"];

/* ---------- État ---------- */
let me = null, kids = [], routines = [], log = [], loaded = false;
let tab = "home", dayOffset = 0, busy = new Set(), sheet = null;
let writeGen = 0, sig = "", pollTimer = null;
const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e){} },
};

/* ---------- Icônes ---------- */
const I = {
  check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',

/* ---------- Base Firebase (REST) ---------- */
async function apiFetch(url, method, data){
  const opts = {method, headers: {"Content-Type": "application/json"}};
  if (data !== undefined) opts.body = JSON.stringify(data);
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
const ref = path => {
  const url = BASE + "/" + path + ".json";
  return { get: () => apiFetch(url, "GET"), set: d => apiFetch(url, "PUT", d), update: d => apiFetch(url, "PATCH", d), delete: () => apiFetch(url, "DELETE") };
};
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------- Calculs ---------- */
const units = k => (k.big|0) * PER_BIG + (k.small|0);
const fromUnits = u => ({small: u % PER_BIG, big: Math.floor(u / PER_BIG)});
const rewardOf = r => (r.s != null || r.b != null) ? {s: r.s|0, b: r.b|0} : (r.size === "b" ? {s:0, b:1} : {s:1, b:0});
const entryReward = l => (l.gs != null || l.gb != null) ? {s: l.gs|0, b: l.gb|0} : (l.size === "b" ? {s:0, b:1} : {s:1, b:0});
const rewardUnits = w => w.s + w.b * PER_BIG;
function entrySecs(l){
  if (l.t === "earn") return rewardUnits(entryReward(l)) * UNIT;
  if (l.t === "use") return l.secs|0;
  return l.t === "big" ? BIG : UNIT;
}
function dur(sec){
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  if (h) return `${h} h` + (m || s ? ` ${String(m).padStart(2, "0")} min` : "") + (s ? ` ${s} s` : "");
  if (m) return `${m} min` + (s ? ` ${s} s` : "");
  return `${s} s`;
}
function bigDur(sec){
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  if (h) return `${h}<small>h</small> ${String(m).padStart(2, "0")}<small>min</small>`;
  if (m) return `${m}<small>min</small>` + (s ? ` ${s}<small>s</small>` : "");
  return `${s}<small>s</small>`;
}
function pompons(w){
  const p = [];
  if (w.b) p.push(w.b + " gros");
  if (w.s) p.push(w.s + (w.s > 1 ? " petits" : " petit"));
  return p.join(" + ") || "0";
}
const plural = (n, one, many) => n + " " + (n > 1 ? many : one);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const color = k => `var(${COLORS[(k?.color ?? 0) % COLORS.length]})`;
const kidById = id => kids.find(k => k.id === id);
function dayKey(offset){ const d = new Date(); d.setDate(d.getDate() - offset); return keyOf(d); }
const keyOf = ts => { const d = new Date(ts); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const hm = ts => new Date(ts).toLocaleTimeString("fr-FR", {hour: "2-digit", minute: "2-digit"});
function dayLabel(ts){
  const d = new Date(ts), now = new Date(), y = new Date(); y.setDate(now.getDate() - 1);
  if (d.toDateString() === now.toDateString()) return "Aujourd'hui";
  if (d.toDateString() === y.toDateString()) return "Hier";
  const s = d.toLocaleDateString("fr-FR", {weekday: "long", day: "numeric", month: "long"});
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* ---------- Écritures ---------- */
async function change(kidId, delta, entry, msg){
  const k = kidById(kidId); if (!k || busy.has(kidId)) return false;
  const next = fromUnits(Math.max(0, units(k) + delta));
  const id = newId();
  busy.add(kidId); writeGen++; render();
  try {
    await ref("kids/" + kidId).update(next);
    await ref("log/" + id).set(entry);
    Object.assign(k, next); log.unshift({id, ...entry});
    toast(msg, () => revert(kidId, delta, id, "Annulé"));
    return true;
  } catch(e){ fail(e); return false; }
  finally { busy.delete(kidId); render(); }
}
async function revert(kidId, delta, logId, msg){
  const k = kidById(kidId); if (!k || busy.has(kidId)) return;
  const next = fromUnits(Math.max(0, units(k) - delta));
  busy.add(kidId); writeGen++; render();
  try {
    await ref("kids/" + kidId).update(next);
    await ref("log/" + logId).delete();
    Object.assign(k, next); log = log.filter(l => l.id !== logId);
    if (msg) toast(msg);
  } catch(e){ fail(e); }
  finally { busy.delete(kidId); render(); }
}
function give(kidId, w, routine){
  const k = kidById(kidId); if (!k) return;
  const entry = {t: "earn", kid: kidId, at: Date.now(), by: me, gs: w.s, gb: w.b};
  if (routine){ entry.routine = routine.id; entry.label = routine.label; entry.day = dayKey(dayOffset); }
  const what = routine ? routine.label : pompons(w);
  return change(kidId, rewardUnits(w), entry, `${k.name} · +${dur(rewardUnits(w) * UNIT)}` + (routine ? ` · ${what}` : ""));
}
function spend(kidId, minutes){
  const k = kidById(kidId); if (!k) return;
  const need = minutes * 60 / UNIT;
  if (units(k) < need) return;
  return change(kidId, -need, {t: "use", kid: kidId, at: Date.now(), by: me, secs: minutes * 60}, `${k.name} utilise ${dur(minutes * 60)}`);
}
function uncheck(entry){
  const k = kidById(entry.kid); if (!k) return;
  revert(k.id, rewardUnits(entryReward(entry)), entry.id, `${entry.label || "Routine"} décochée`);
}

/* ---------- Rendu ---------- */
function render(){
  $("title").textContent = tab === "history" ? "Historique" : tab === "settings" ? "Réglages" : "Les Pompons";
  document.querySelectorAll(".tab").forEach(b => b.dataset.tab === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  const v = $("view");
  if (!loaded){ v.innerHTML = `<div class="card empty">Chargement…</div>`; return; }
  v.innerHTML = tab === "history" ? viewHistory() : tab === "settings" ? viewSettings() : viewHome();
  if (sheet?.type === "use") renderSheet();
}

function viewHome(){
  if (!kids.length) return `<div class="card empty">Aucun enfant pour l'instant.<br><br>
    <button class="btn" type="button" data-a="kid-new">Ajouter un enfant</button></div>`;
  return `<div class="board ${kids.length === 1 ? "one" : ""}">${kids.map(kidCard).join("")}</div>` + routinesBlock();
}

let shown = {};
function kidCard(k){
  const u = units(k), secs = u * UNIT, b = busy.has(k.id) ? "disabled" : "";
  const big = k.big|0, small = k.small|0, prev = shown[k.id] ?? big;
  shown[k.id] = big;
  const MAX = 12;
  const stk = big ? Array.from({length: Math.min(big, MAX)}, (_, i) => `<i class="st ${i >= prev ? "pop" : ""}"></i>`).join("") + (big > MAX ? `<span class="more">+${big - MAX}</span>` : "")
                  : `<span class="kc-sub" style="margin:0">Pas encore de gros pompon</span>`;
  const pts = Array.from({length: PER_BIG}, (_, i) => `<i class="pt ${i < small ? "on" : ""}"></i>`).join("");
  const can = secs >= USE_DEFAULT * 60;
  return `<article class="kc" style="--c:${color(k)}" aria-label="${esc(k.name)}">
    <div class="kc-h"><b>${esc(k.name)}</b></div>
    <div class="kc-b">
      <div><div class="kc-time num">${shortDur(secs)}</div>
        <div class="kc-sub">${plural(big, "gros", "gros")} · ${plural(small, "petit", "petits")}</div></div>
      <div class="stk" aria-hidden="true">${stk}</div>
      <div class="pts" aria-label="${small} petits sur 10">${pts}<span>${small}/10</span></div>
      <div class="kc-btns">
        <button class="btn add-s" type="button" data-a="give" data-kid="${k.id}" data-s="1" data-b="0" ${b}>+1 petit <small>30 s</small></button>
        <button class="btn add-b" type="button" data-a="give" data-kid="${k.id}" data-s="0" data-b="1" ${b}>+1 gros <small>5 min</small></button>
        <button class="btn btn-primary" type="button" data-a="use" data-kid="${k.id}" data-min="${USE_DEFAULT}" aria-label="Utiliser ${USE_DEFAULT} min" ${!can || b ? "disabled" : ""}>−${USE_DEFAULT} min</button>
        ${!can ? `<p class="hint">${secs ? `Encore ${dur(USE_DEFAULT * 60 - secs)} à gagner` : "Plus de temps"}</p>` : ""}
        <button class="btn btn-link" type="button" data-a="sheet-use" data-kid="${k.id}" ${!u || b ? "disabled" : ""}>Autre durée</button>
      </div>
    </div>
  </article>`;
}
function shortDur(sec){
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  if (h) return `${h}<small> h </small>${String(m).padStart(2, "0")}`;
  if (m) return `${m}<small> min</small>` + (s ? `<small> ${s} s</small>` : "");
  return `${s}<small> s</small>`;
}

function routinesBlock(){
  const day = dayKey(dayOffset);
  const done = new Map();
  log.forEach(l => { if (l.t === "earn" && l.routine && l.day === day){ const key = l.kid + "|" + l.routine; done.set(key, (done.get(key) || 0) + 1); } });
  const cols = `minmax(0,1fr) repeat(${kids.length}, ${kids.length > 2 ? 50 : 60}px)`;
  let html = `<div class="rt" style="grid-template-columns:${cols}"><div class="hd lb">Routine</div>` +
    kids.map(k => `<div class="hd kh" style="--c:${color(k)}"><i></i>${esc(k.name)}</div>`).join("");
  routines.forEach(r => {
    const w = rewardOf(r);
    html += `<div class="lb"><div class="row-t">${esc(r.label)}</div><div class="row-s">${pompons(w)} · ${dur(rewardUnits(w) * UNIT)}${r.rep ? " · à chaque fois" : ""}</div></div>`;
    kids.forEach(k => {
      const n = done.get(k.id + "|" + r.id) || 0, b = busy.has(k.id) ? "disabled" : "";
      html += `<div class="cl" style="--c:${color(k)}">` + (r.rep
        ? `<div class="cnt"><button class="ck rep ${n ? "on" : ""}" type="button" data-a="r-add" data-kid="${k.id}" data-id="${r.id}" aria-label="${esc(r.label)} pour ${esc(k.name)} : ${n} fois, ajouter" ${b}>${n || "+"}</button>
            ${n ? `<button class="minus" type="button" data-a="r-minus" data-kid="${k.id}" data-id="${r.id}" aria-label="Retirer une fois" ${b}>−1</button>` : ""}</div>`
        : `<button class="ck ${n ? "on" : ""}" type="button" data-a="r-toggle" data-kid="${k.id}" data-id="${r.id}" aria-pressed="${!!n}" aria-label="${esc(r.label)} pour ${esc(k.name)}" ${b}>${I.check}</button>`) + `</div>`;
    });
  });
  html += `</div>`;
  const total = kids.map(k => `${esc(k.name)} ${routines.filter(r => done.get(k.id + "|" + r.id)).length}/${routines.length}`).join(" · ");
  return `<section>
    <div class="sec-h"><h2>Routines</h2>
      <div class="seg" role="group" aria-label="Jour">
        <button type="button" data-a="day" data-d="0" aria-pressed="${dayOffset === 0}">Aujourd'hui</button>
        <button type="button" data-a="day" data-d="1" aria-pressed="${dayOffset === 1}">Hier</button>
      </div></div>
    ${routines.length ? `<div class="list">${html}</div><p class="done-n">${total}</p>` : `<div class="list empty">Aucune routine. Ajoute-les dans Réglages.</div>`}
  </section>`;
}

function viewHistory(){
  const now = new Date(); now.setHours(0,0,0,0); now.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const ws = now.getTime();
  const week = kids.length ? `<section><div class="sec-h"><h2>Cette semaine</h2></div>
    <div class="list week"><div class="h">Enfant</div><div class="h v">Gagné</div><div class="h v">Utilisé</div>` +
    kids.map(k => {
      const mine = log.filter(l => l.kid === k.id && l.at >= ws);
      const earned = mine.filter(l => l.t === "earn").reduce((s, l) => s + entrySecs(l), 0);
      const used = mine.filter(l => l.t !== "earn").reduce((s, l) => s + entrySecs(l), 0);
      return `<div class="k" style="--c:${color(k)}"><span class="dot"></span>${esc(k.name)}</div>
        <div class="v num">${earned ? dur(earned) : "—"}</div><div class="v num">${used ? dur(used) : "—"}</div>`;
    }).join("") + `</div></section>` : "";

  const rows = log.slice(0, 150);
  if (!rows.length) return week + `<section><div class="card empty">Rien pour l'instant. Les pompons donnés et utilisés apparaîtront ici.</div></section>`;
  const groups = [];
  rows.forEach(r => { const d = dayLabel(r.at); const g = groups[groups.length - 1]; if (g && g.d === d) g.items.push(r); else groups.push({d, items: [r]}); });
  return week + groups.map(g => `<section><h3 class="day-h">${g.d}</h3><div class="list">` + g.items.map(r => {
    const k = kidById(r.kid) || {name: "Enfant supprimé", color: 0};
    const earn = r.t === "earn";
    let what;
    if (earn) what = (r.label ? esc(r.label) : "Pompons donnés") + ` <span class="row-s">· ${pompons(entryReward(r))}</span>`;
    else what = "Temps utilisé";
    const late = earn && r.day && r.day !== keyOf(r.at) ? " · pour la veille" : "";
    return `<div class="row" style="--c:${color(k)}"><span class="dot"></span>
      <div class="row-main"><div class="row-t">${esc(k.name)} — ${what}</div><div class="row-s">${hm(r.at)}${r.by ? " · " + esc(r.by) : ""}${late}</div></div>
      <span class="amt num ${earn ? "plus" : "minus"}">${earn ? "+" : "−"}${dur(entrySecs(r))}</span></div>`;
  }).join("") + `</div></section>`).join("");
}

function viewSettings(){
  const kidRows = kids.map(k => `<button class="row" type="button" data-a="kid-edit" data-id="${k.id}" style="--c:${color(k)}">
    <span class="dot"></span><div class="row-main"><div class="row-t">${esc(k.name)}</div></div>${I.chev}</button>`).join("");
  const rRows = routines.map(r => { const w = rewardOf(r); return `<button class="row" type="button" data-a="r-edit" data-id="${r.id}">
    <div class="row-main"><div class="row-t">${esc(r.label)}</div><div class="row-s">${pompons(w)} · ${r.rep ? "plusieurs fois par jour" : "une fois par jour"}</div></div>${I.chev}</button>`; }).join("");
  return `<section><div class="sec-h"><h2>Enfants</h2></div><div class="list">${kidRows}
      ${kids.length < 4 ? `<button class="row" type="button" data-a="kid-new"><div class="row-main"><div class="row-t">Ajouter un enfant</div></div>${I.plus}</button>` : ""}</div></section>
    <section><div class="sec-h"><h2>Routines</h2><span class="meta">${routines.length}</span></div><div class="list">${rRows}
      <button class="row" type="button" data-a="r-new"><div class="row-main"><div class="row-t">Nouvelle routine</div></div>${I.plus}</button></div></section>
    <section><div class="sec-h"><h2>Règles</h2></div><div class="list">
      <div class="row"><div class="row-main"><div class="row-t">1 petit pompon</div></div><span class="row-s">30 s</span></div>
      <div class="row"><div class="row-main"><div class="row-t">1 gros pompon</div></div><span class="row-s">5 min</span></div>
      <div class="row"><div class="row-main"><div class="row-t">10 petits</div></div><span class="row-s">1 gros</span></div></div></section>
    <section><div class="sec-h"><h2>Compte</h2></div><div class="list">
      <div class="row"><div class="row-main"><div class="row-t">Connecté : ${esc(me || "")}</div></div></div>
      <button class="row" type="button" data-a="logout"><div class="row-main"><div class="row-t" style="color:var(--danger)">Changer d'utilisateur</div></div></button></div></section>`;
}

/* ---------- Feuilles (sheets) ---------- */
function openSheet(s){ sheet = s; renderSheet(); const d = $("sheet"); if (!d.open) d.showModal(); }
function closeSheet(){ sheet = null; const d = $("sheet"); if (d.open) d.close(); }
$("sheet").addEventListener("close", () => { sheet = null; });
$("sheet").addEventListener("click", e => { if (e.target === $("sheet")) closeSheet(); });

function head(title, sub){
  return `<div class="grab" aria-hidden="true"></div><div class="sheet-h"><div><h3 id="sheetTitle">${title}</h3>${sub ? `<p>${sub}</p>` : ""}</div>
    <button class="x" type="button" data-a="close" aria-label="Fermer">${I.x}</button></div>`;
}
function renderSheet(){
  const body = $("sheetBody"); if (!sheet) return;
  const k = kidById(sheet.kid);
  if (sheet.type === "use"){
    const have = units(k) * UNIT, b = busy.has(k.id);
    body.innerHTML = head(`Utiliser du temps`, `${esc(k.name)} · ${dur(have)} disponibles`) +
      `<div class="opts">` + USE_OPTIONS.map(m => `<button class="opt num ${m === USE_DEFAULT ? "main" : ""}" type="button" data-a="use" data-kid="${k.id}" data-min="${m}" ${m * 60 > have || b ? "disabled" : ""}>
        ${m >= 60 ? m / 60 + " h" : m + " min"}<small>${m * 60 / BIG} gros</small></button>`).join("") + `</div>`;
  } else if (sheet.type === "kid"){
    const k2 = kidById(sheet.id);
    const c = sheet.color ?? k2?.color ?? 0;
    body.innerHTML = head(k2 ? "Modifier l'enfant" : "Nouvel enfant") + `
      <form id="kidForm"><div class="field"><label for="kName">Prénom</label>
        <input class="input" id="kName" maxlength="24" autocomplete="off" value="${esc(k2?.name || "")}" required></div>
      <div class="field"><span class="lab">Couleur</span><div class="colors">` +
      COLORS.map((v, i) => `<button type="button" class="sw" style="--c:var(${v})" data-a="kid-color" data-c="${i}" aria-pressed="${i === c}" aria-label="Couleur ${i + 1}">${i === c ? I.check : ""}</button>`).join("") +
      `</div></div><div class="sheet-foot"><button class="btn btn-primary" type="submit">Enregistrer</button>
        ${k2 ? `<button class="btn btn-danger" type="button" data-a="kid-del">${sheet.confirm ? `Confirmer : supprimer ${esc(k2.name)} et son historique` : "Supprimer l'enfant"}</button>` : ""}</div></form>`;
  } else if (sheet.type === "routine"){
    const r = routines.find(x => x.id === sheet.id);
    const f = sheet.form;
    body.innerHTML = head(r ? "Modifier la routine" : "Nouvelle routine") + `
      <form id="rForm"><div class="field"><label for="rLabel">Nom</label>
        <input class="input" id="rLabel" maxlength="80" autocomplete="off" placeholder="Ex. Se brosser les dents" value="${esc(f.label)}" required></div>
      <div class="frow"><div class="lab">Gros pompons<small>5 min chacun</small></div>
        <div class="step"><button type="button" data-a="f-step" data-f="b" data-d="-1" ${f.b <= 0 ? "disabled" : ""} aria-label="Moins">${I.minus}</button><span class="n num">${f.b}</span><button type="button" data-a="f-step" data-f="b" data-d="1" ${f.b >= 10 ? "disabled" : ""} aria-label="Plus">${I.plus}</button></div></div>
      <div class="frow"><div class="lab">Petits pompons<small>30 s chacun</small></div>
        <div class="step"><button type="button" data-a="f-step" data-f="s" data-d="-1" ${f.s <= 0 ? "disabled" : ""} aria-label="Moins">${I.minus}</button><span class="n num">${f.s}</span><button type="button" data-a="f-step" data-f="s" data-d="1" ${f.s >= 20 ? "disabled" : ""} aria-label="Plus">${I.plus}</button></div></div>
      <div class="frow"><label class="lab" for="rRep">Plusieurs fois par jour<small>Un compteur au lieu d'une case</small></label>
        <input type="checkbox" class="switch" id="rRep" ${f.rep ? "checked" : ""}></div>
      <p class="summary">Rapporte ${dur(rewardUnits(f) * UNIT)} ${f.rep ? "à chaque fois" : "par jour"}</p>
      <div class="sheet-foot"><button class="btn btn-primary" type="submit" ${!f.s && !f.b ? "disabled" : ""}>Enregistrer</button>
        ${r ? `<button class="btn btn-danger" type="button" data-a="r-del">${sheet.confirm ? "Confirmer la suppression" : "Supprimer la routine"}</button>` : ""}</div></form>`;
  }
}

/* ---------- Actions (délégation) ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-a]"); if (!t || t.disabled) return;
  const a = t.dataset.a;
  switch (a){
    case "day": dayOffset = +t.dataset.d; render(); break;
    case "use": if (await spend(t.dataset.kid || sheet?.kid, +t.dataset.min)) closeSheet(); break;
    case "sheet-use": openSheet({type: "use", kid: t.dataset.kid}); break;
    case "give": give(t.dataset.kid, {s: +t.dataset.s, b: +t.dataset.b}); break;
    case "r-toggle": case "r-add": {
      const r = routines.find(x => x.id === t.dataset.id), k = kidById(t.dataset.kid); if (!r || !k) break;
      if (a === "r-toggle"){
        const ex = log.find(l => l.t === "earn" && l.routine === r.id && l.kid === k.id && l.day === dayKey(dayOffset));
        if (ex){ uncheck(ex); break; }
      }
      give(k.id, rewardOf(r), r); break;
    }
    case "r-minus": {
      const ex = log.find(l => l.t === "earn" && l.routine === t.dataset.id && l.kid === t.dataset.kid && l.day === dayKey(dayOffset));
      if (ex) uncheck(ex); break;
    }
    case "close": closeSheet(); break;
    case "kid-new": openSheet({type: "kid", id: null, color: [0,1,2,3].find(c => !kids.some(x => x.color === c)) ?? 0}); break;
    case "kid-edit": openSheet({type: "kid", id: t.dataset.id}); break;
    case "kid-color": sheet.color = +t.dataset.c; { const v = $("kName").value; renderSheet(); $("kName").value = v; } break;
    case "kid-del": {
      const v = $("kName").value;
      if (!sheet.confirm){ sheet.confirm = true; renderSheet(); $("kName").value = v; break; }
      const id = sheet.id, name = kidById(id)?.name || "";
      const gone = Object.fromEntries(log.filter(l => l.kid === id).map(l => [l.id, null]));
      try {
        writeGen++;
        if (Object.keys(gone).length) await ref("log").update(gone);
        await ref("kids/" + id).delete();
        kids = kids.filter(k => k.id !== id); log = log.filter(l => l.kid !== id);
        closeSheet(); render(); toast(`${name} supprimé(e)`);
      } catch(err){ fail(err); }
      break;
    }
    case "r-new": openSheet({type: "routine", id: null, form: {label: "", s: 0, b: 1, rep: false}}); break;
    case "r-edit": { const r = routines.find(x => x.id === t.dataset.id); if (!r) break; const w = rewardOf(r);
      openSheet({type: "routine", id: r.id, form: {label: r.label, s: w.s, b: w.b, rep: !!r.rep}}); break; }
    case "f-step": { const f = sheet.form; f.label = $("rLabel").value; f.rep = $("rRep").checked;
      f[t.dataset.f] = Math.max(0, f[t.dataset.f] + +t.dataset.d); renderSheet(); break; }
    case "r-del":
      if (!sheet.confirm){ sheet.form.label = $("rLabel").value; sheet.form.rep = $("rRep").checked; sheet.confirm = true; renderSheet(); break; }
      try { writeGen++; await ref("routines/" + sheet.id).delete(); routines = routines.filter(r => r.id !== sheet.id); closeSheet(); render(); toast("Routine supprimée"); }
      catch(err){ fail(err); }
      break;
    case "logout": logout(); break;
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "rRep" && sheet?.form){ sheet.form.rep = e.target.checked; sheet.form.label = $("rLabel").value; renderSheet(); }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "kidForm"){
    const name = $("kName").value.trim(); if (!name) return;
    const k = kidById(sheet.id), col = sheet.color ?? k?.color ?? 0;
    try {
      writeGen++;
      if (k){ await ref("kids/" + k.id).update({name, color: col}); Object.assign(k, {name, color: col}); }
      else { const id = newId(), d = {name, small: 0, big: 0, color: col, order: Date.now()}; await ref("kids/" + id).set(d); kids.push({id, ...d}); }
      closeSheet(); render();
    } catch(err){ fail(err); }
  }
  if (e.target.id === "rForm"){
    const f = sheet.form; f.label = $("rLabel").value.trim(); f.rep = $("rRep").checked;
    if (!f.label || (!f.s && !f.b)) return;
    const data = {label: f.label, s: f.s, b: f.b, rep: f.rep};
    try {
      writeGen++;
      if (sheet.id){ await ref("routines/" + sheet.id).update(data); Object.assign(routines.find(r => r.id === sheet.id), data); }
      else { const id = newId(), d = {...data, order: Date.now()}; await ref("routines/" + id).set(d); routines.push({id, ...d}); }
      closeSheet(); render(); toast("Routine enregistrée");
    } catch(err){ fail(err); }
  }
});
$("tabbar").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  tab = b.dataset.tab; render(); window.scrollTo(0, 0);
});

/* ---------- Toast ---------- */
let toastT = null;
function toast(msg, undo){
  $("toastMsg").textContent = msg;
  const u = $("toastUndo"); u.hidden = !undo;
  u.onclick = () => { $("toast").hidden = true; undo && undo(); };
  $("toast").hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => $("toast").hidden = true, undo ? 6000 : 3000);
}
function fail(e){ console.error(e); toast("Pas enregistré. Vérifie la connexion et réessaie."); }

/* ---------- Synchronisation ---------- */
// shortcut: polling every 3 s instead of a realtime stream
async function poll(){
  const gen = writeGen;
  try {
    const [k, r, l] = await Promise.all([ref("kids").get(), ref("routines").get(), ref("log").get()]);
    $("offline").hidden = true;
    if (gen !== writeGen) return;
    const s = JSON.stringify([k, r, l]);
    if (s === sig && loaded) return;
    sig = s; loaded = true;
    const list = o => o ? Object.entries(o).map(([id, v]) => ({id, ...v})) : [];
    kids = list(k).sort((a, b) => a.order - b.order);
    routines = list(r).sort((a, b) => a.order - b.order);
    log = list(l).sort((a, b) => b.at - a.at);
    render();
  } catch(e){ $("offline").hidden = false; if (!loaded){ loaded = true; render(); } }
}
async function boot(){
  render();
  try { await seedIfEmpty(); } catch(e){ console.warn("Seed:", e.message); }
  await poll();
  clearInterval(pollTimer); pollTimer = setInterval(() => { if (!document.hidden) poll(); }, 3000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && me) poll(); });

/* ---------- Connexion ---------- */
let pin = "";
function drawPins(){ document.querySelectorAll("#pins i").forEach((d, i) => d.classList.toggle("on", i < pin.length)); }
$("pad").addEventListener("click", e => {
  const b = e.target.closest("[data-k]"); if (!b) return;
  $("pinErr").textContent = "";
  if (b.dataset.k === "del") pin = pin.slice(0, -1);
  else if (pin.length < 4) pin += b.dataset.k;
  drawPins();
  if (pin.length === 4) setTimeout(checkPin, 120);
});
document.addEventListener("keydown", e => {
  if ($("login").hidden || $("pinStep").hidden) return;
  if (/^[0-9]$/.test(e.key)) $("pad").querySelector(`[data-k="${e.key}"]`).click();
  if (e.key === "Backspace") $("pad").querySelector('[data-k="del"]').click();
});
function checkPin(){
  if (pin === PIN){ $("pinStep").hidden = true; $("whoStep").hidden = false; return; }
  pin = ""; drawPins(); $("pinErr").textContent = "Code incorrect";
  const p = $("pins"); p.classList.remove("bad"); void p.offsetWidth; p.classList.add("bad");
}
$("who").innerHTML = USERS.map(u => `<button class="btn" type="button" data-user="${u}">${u}</button>`).join("");
$("who").addEventListener("click", e => {
  const b = e.target.closest("[data-user]"); if (!b) return;
  me = b.dataset.user; store.set("pompons_user", me);
  $("login").hidden = true; boot();
});
function logout(){
  store.set("pompons_user", null); me = null; clearInterval(pollTimer);
  pin = ""; drawPins(); $("pinStep").hidden = false; $("whoStep").hidden = true; $("login").hidden = false;
}

me = store.get("pompons_user");
if (me) boot(); else $("login").hidden = false;
</script>
